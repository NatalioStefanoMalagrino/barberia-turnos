{% extends "base.html" %}
{% block titulo %}Panel · {{ negocio.nombre }}{% endblock %}

{% block contenido %}
<main class="pagina-centrada">
  <form class="tarjeta" method="post" action="/panel/login">
    <span class="marca">{{ negocio.nombre }}</span>
    <h1>Panel de barberos</h1>
    {% if error %}<p class="aviso aviso--error">{{ error }}</p>{% endif %}
    <label class="campo">Usuario
      <input name="usuario" autocomplete="username" required autofocus>
    </label>
    <label class="campo">Contraseña
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="boton boton--ancho" type="submit">Entrar</button>
  </form>
</main>
{% endblock %}
